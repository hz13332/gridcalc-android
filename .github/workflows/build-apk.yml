name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: 构建 Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: GridCalc-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: 读取版本号
        if: github.event_name == 'workflow_dispatch'
        id: ver
        # 版本号唯一来源:app/build.gradle.kts 的 versionName
        # 版本规则:小版本自动递增,大版本(小数点前)由维护者指定
        # 发版必须经维护者确认,手动点 Run workflow 才发布
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "name=$V" >> $GITHUB_OUTPUT
      - name: 发布 Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: v${{ steps.ver.outputs.name }}
          files: app/build/outputs/apk/debug/*.apk
