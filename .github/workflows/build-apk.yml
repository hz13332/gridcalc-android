name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      # ⚠ 2026-10-03 签名改为从 Secrets 注入，仓库内不再持有密钥与口令。
      #   起因：keystore/gridcalc.jks 曾随仓库公开（口令明文写在 build.gradle.kts），
      #   任何人 clone 即可签出与本应用同签名的 APK 冒充官方更新。
      #   必须在仓库 Settings → Secrets and variables → Actions 里配置这四项：
      #     GC_STORE_PASSWORD / GC_KEY_PASSWORD / GC_KEY_ALIAS / GC_KEYSTORE_B64
      # ⚠ 2026-10-05 **这四个变量名原来全写错了**（实测 CI 在这一步之后的
      #   `error("缺少签名口令")` 上必挂）。
      #   build.gradle.kts 的 secret() 是这么拼名字的：
      #     System.getenv("GC_" + key.replace(".", "_").uppercase())
      #   ⟹ secret("gc.storePassword") 实际读 **GC_STOREPASSWORD**（STORE 与 PASSWORD 之间没有下划线）
      #      secret("gc.keyPassword")    实际读 **GC_KEYPASSWORD**
      #      secret("gc.keyAlias")       实际读 **GC_KEYALIAS**
      #   旧写法 GC_STORE_PASSWORD / GC_KEY_PASSWORD / GC_KEY_ALIAS **一个都对不上**，
      #   而 GitHub 的 env: 只是把 secret 注入成同名的环境变量，对不上名就等于没注入。
      #   ⟹ 名字必须与 secret() 拼出来的一致，**不要"顺手加下划线"**。
      GC_STOREPASSWORD: ${{ secrets.GC_STORE_PASSWORD }}
      GC_KEYPASSWORD: ${{ secrets.GC_KEY_PASSWORD }}
      GC_KEYALIAS: ${{ secrets.GC_KEY_ALIAS }}
      # ⚠ 显式给出密钥文件路径。build.gradle.kts 读 GC_KEYSTORE_PATH，取不到就退回
      #   相对路径 `../keystore/gridcalc.jks`（相对 app/ 解析到仓库根，同样能取到）。
      #   这里写绝对路径只是把它从"隐式约定"变成"看得见"，两条路指向同一个文件。
      GC_KEYSTORE_PATH: ${{ github.workspace }}/keystore/gridcalc.jks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 还原签名密钥
        # base64 → 二进制 → keystore/gridcalc.jks
        # GC_KEYSTORE_B64 的生成方式（在有密钥的机器上执行一次）：
        #   [Convert]::ToBase64String([IO.File]::ReadAllBytes('keystore\gridcalc.jks'))
        #
        # ⚠ **空 secret 不会让这一步失败**（`echo "" | base64 -d` 退出 0，产出 0 字节文件），
        #   于是它一路混到构建才炸，报错信息跟真正原因隔了十万八千里。
        #   ⟹ 这里显式断言非空 + 是合法 base64，让失败停在**真正的原因**上。
        run: |
          set -euo pipefail
          B64="${{ secrets.GC_KEYSTORE_B64 }}"
          if [ -z "$B64" ]; then
            echo "::error::GC_KEYSTORE_B64 是空的。请在 Settings → Secrets and variables → Actions 里配置它。"
            exit 1
          fi
          # 2026-11-05：仓库不含 keystore/（.gitignore 排除），checkout 后目录不存在，
          # 直接重定向会以 “No such file or directory” 失败 —— 这正是历次构建卡在第 4 步的原因。
          mkdir -p keystore
          printf '%s' "$B64" | tr -d '\r\n' | base64 -d > keystore/gridcalc.jks
          SZ=$(stat -c %s keystore/gridcalc.jks)
          if [ "$SZ" -lt 512 ]; then
            echo "::error::解出来的 keystore 只有 $SZ 字节，说明 GC_KEYSTORE_B64 的内容不是合法 base64（常见原因：粘成了占位文字、带了引号或中文）。"
            exit 1
          fi
          echo "keystore bytes: $SZ"
      - uses: gradle/actions/setup-gradle@v3
      - name: 构建 Release APK
        env:
          # ⚠ job 级 env 里取不到 `runner` 上下文（会解析成空串），必须写在 step 上。
          GRIDCALC_BUILD_ROOT: /tmp/gc-build
        run: |
          chmod +x gradlew
          set -o pipefail
          {
            for v in GC_STOREPASSWORD GC_KEYPASSWORD GC_KEYALIAS GC_KEYSTORE_PATH; do
              eval "val=\$$v"
              echo "$v len=${#val}"
            done
            ls -l "$GC_KEYSTORE_PATH" || true
          } | tee /tmp/build.log
          ./gradlew assembleRelease 2>&1 | tee -a /tmp/build.log
      - name: 上传失败日志到 ci-log 分支
        if: failure()
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          cp /tmp/build.log ci-logs/build.log || true
          git config user.name ci-bot
          git config user.email ci-bot@local
          git add -f ci-logs/build.log
          git commit -m "ci log $(date -u +%FT%TZ)" || true
          git push --force origin HEAD:ci-log
      - name: 读取版本号
        id: ver
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "name=$V" >> $GITHUB_OUTPUT
      - name: 重命名 APK
        run: |
          # 2026-11-05：构建输出被 GRIDCALC_BUILD_ROOT 挪到 /tmp/gc-build，
          # 不再是仓库内 app/build/…
          cd /tmp/gc-build/app/outputs/apk/release
          mv app-release.apk "GridCalc-v${{ steps.ver.outputs.name }}.apk"
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: GridCalc-apk
          path: /tmp/gc-build/app/outputs/apk/release/GridCalc-*.apk
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: v${{ steps.ver.outputs.name }}
          files: /tmp/gc-build/app/outputs/apk/release/GridCalc-*.apk