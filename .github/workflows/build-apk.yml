name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: 构建 Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PciBuildNumber=$GITHUB_RUN_NUMBER
      - name: 读取版本号
        id: ver
        # 版本号唯一来源:app/build.gradle.kts 的 versionName
        # 版本规则:每次上传自动递增小版本,大版本(小数点前)由维护者指定
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "name=$V" >> $GITHUB_OUTPUT
      - name: 重命名 APK
        run: |
          cd app/build/outputs/apk/debug
          mv app-debug.apk "GridCalc-v${{ steps.ver.outputs.name }}.apk"
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: GridCalc-apk
          path: app/build/outputs/apk/debug/GridCalc-*.apk
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: v${{ steps.ver.outputs.name }}
          files: app/build/outputs/apk/debug/GridCalc-*.apk
