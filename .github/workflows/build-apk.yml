name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: 构建 Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PciBuildNumber=$GITHUB_RUN_NUMBER
      - name: 重命名 APK
        run: |
          cd app/build/outputs/apk/debug
          mv app-debug.apk "GridCalc-${{ github.ref_name }}.apk"
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: GridCalc-apk
          path: app/build/outputs/apk/debug/GridCalc-*.apk
      # 发版门:只有 v* tag 推送(或手动点 Run)才发布,平时 push 只验编。
      # 版本号唯一来源:app/build.gradle.kts 的 versionName,须与 tag 一致。
      # 版本规则:小版本自动递增,大版本(小数点前)由维护者指定。
      # versionCode 由构建号自动递增(30000+run),每次上传都可覆盖安装。
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: app/build/outputs/apk/debug/GridCalc-*.apk
