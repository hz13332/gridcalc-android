name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      - name: 安装 buildozer
        run: pip install buildozer cython==0.29.36
      - name: 构建 APK
        run: buildozer android debug
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: GridCalc-apk
          path: bin/*.apk
      - name: 发布 Release 免登录下载
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 安卓安装包 apk-${{ github.run_number }}
          files: bin/*.apk
